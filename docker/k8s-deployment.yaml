# AgentScope Kubernetes deployment
#
# Before applying:
# 1. Replace every "change-me" value below.
# 2. Ensure both :local images exist on every Kubernetes node, or replace
#    them with image names from a registry reachable by the cluster.
# 3. Apply with: kubectl apply -f docker/k8s-deployment.yaml
# 4. Browser access through any reachable Kubernetes node:
#      Web UI:       http://<node-ip>:30080
#      Agent server: http://<node-ip>:30800

apiVersion: v1
kind: Namespace
metadata:
  name: agentscope
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentscope-config
  namespace: agentscope
data:
  REDIS_HOST: "172.19.10.26"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  MILVUS_URI: "https://in03-27c7c2ecead182f.serverless.ali-cn-hangzhou.cloud.zilliz.com.cn"
  MILVUS_DB_NAME: "default"
  S3_BUCKET: "sc-dp"
  S3_ENDPOINT: "http://eos.jinan-4.cmecloud.cn"
  S3_USE_SSL: "true"
  S3_ADDRESSING_STYLE: "auto"
  S3_SIGNATURE_VERSION: "s3v4"
  AWS_REGION: "jinan4"
  PLAYWRIGHT_MCP_COMMAND: "playwright-mcp"
  PLAYWRIGHT_MCP_ARGS: "--headless --no-sandbox --executable-path /opt/playwright-browser/chrome"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentscope-secrets
  namespace: agentscope
type: Opaque
stringData:
  REDIS_PASSWORD: "sypm@123456"
  MILVUS_TOKEN: "28bbb7654c0312052143ec2d339ffa7befbdcf73cf3c3042086bb08982ebefabd4b85237bfd90cc0b5ae0ec172eb214ab27a5c36"
  AWS_ACCESS_KEY_ID: "B48Q40ZBTCMW6OVB3420"
  AWS_SECRET_ACCESS_KEY: "ZsRxED20zNj5MsakLcKCPPekYCnnPDS8gLzICRGF"
  AWS_SESSION_TOKEN: ""
  AMAP_API_KEY: "68715d61ee4ae56be37493c9e771d36b"
  LUCKIN_MCP_TOKEN: "91c3aaf883dc4fefbcb9b3cd88a2307b5mcpLUCKIN_MCP_AI"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentscope-workspaces-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  nfs:
    server: 10.193.129.199
    path: /3e138d6f-6c14-4a0d-8a5f-e7dbb27e1fcd/agentscope-workspaces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentscope-workspaces-static
  namespace: agentscope
spec:
  storageClassName: nfs-storage
  volumeName: agentscope-workspaces-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscope-agent-service
  namespace: agentscope
  labels:
    app.kubernetes.io/name: agentscope-agent-service
    app.kubernetes.io/part-of: agentscope
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscope-agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscope-agent-service
        app.kubernetes.io/part-of: agentscope
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: agent-service
          image: 172.19.10.7:8888/agent/agentscope-agent-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentscope-config
            - secretRef:
                name: agentscope-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspaces
              mountPath: /app/examples/agent_service/workspaces
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: agentscope-workspaces-static
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentscope-agent-service
  namespace: agentscope
  labels:
    app.kubernetes.io/name: agentscope-agent-service
    app.kubernetes.io/part-of: agentscope
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agentscope-agent-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 31180
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentscope-web-ui
  namespace: agentscope
  labels:
    app.kubernetes.io/name: agentscope-web-ui
    app.kubernetes.io/part-of: agentscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentscope-web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentscope-web-ui
        app.kubernetes.io/part-of: agentscope
    spec:
      containers:
        - name: web-ui
          image: 172.19.10.7:8888/agent/agentscope-web-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: agentscope-web-ui
  namespace: agentscope
  labels:
    app.kubernetes.io/name: agentscope-web-ui
    app.kubernetes.io/part-of: agentscope
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agentscope-web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31280
      protocol: TCP
