              - text: 腾讯云 API 已全面升级到 API 3.0，实现多地域部署，支持就近接入，访问时延显著下降，接口设计标准规范，接口文档详细全面，开发者工具丰富易用，能让您方便快捷地使用腾讯云产品。2023年1月1日起对于新增用户已停止旧版本API 2.0接口服务，对于存量用户预计2023年3月31日停止服务。请还在使用 API 2.0 的用户尽快迁移至 API 3.0，以获得更好的服务和体验。详情请见：
              - link "API 2.0下线通知" [ref=f3e1107] [cursor=pointer]:
                - /url: https://cloud.tencent.com/document/product/1278/82311
